<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三十七道品 · 药方抽签</title>
    <style>
        /* 核心古风美化 */
        body {
            background-color: #fdfcf0; /* 宣纸微黄底色 */
            font-family: "Noto Serif SC", "SimSun", "Georgia", serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
        }

        .title {
            font-size: 22px;
            color: #3c362d;
            letter-spacing: 6px;
            margin-bottom: 60px;
            font-weight: normal;
            border-bottom: 1px solid #dcd6cd;
            padding-bottom: 10px;
        }

        /* 签筒容器 */
        .container {
            position: relative;
            cursor: pointer;
        }

        /* 签筒外观 */
        .stick-holder {
            width: 110px;
            height: 190px;
            background: #5c4433; /* 古朴木色 */
            border-radius: 8px 8px 4px 4px;
            box-shadow: inset 0 12px 20px rgba(0,0,0,0.4), 0 10px 25px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fdfcf0;
            writing-mode: vertical-rl; /* 竖排文字 */
            font-size: 20px;
            letter-spacing: 8px;
            border: 1px solid #4a3629;
        }

        /* 摇动动画 */
        @keyframes shake {
            0% { transform: translate(0, 0) rotate(0deg); }
            20% { transform: translate(-6px, 2px) rotate(-4deg); }
            40% { transform: translate(5px, -1px) rotate(4deg); }
            60% { transform: translate(-5px, -1px) rotate(-3deg); }
            80% { transform: translate(4px, 1px) rotate(2deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        .shaking {
            animation: shake 0.5s ease-in-out infinite;
        }

        /* 遮罩层 */
        .mask {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(40, 35, 30, 0.2);
            backdrop-filter: blur(1px);
            z-index: 10;
        }

        /* 出签 - 初始木签状态 */
        .result-card {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 65px;
            height: 280px;
            background: #e2cca9; /* 木签色 */
            border: 1px solid #8c6e53;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            padding: 25px 10px;
            writing-mode: vertical-rl;
            text-align: center;
            font-size: 24px;
            letter-spacing: 10px;
            color: #2c1a0c;
            border-radius: 4px;
            cursor: pointer;
            z-index: 20;
            animation: popUp 0.4s ease-out forwards;
            box-sizing: border-box;
        }

        /* 解签 - 展开纸牌状态 */
        .result-card.expanded {
            width: 240px;
            height: 400px;
            background: #fbf9f3; /* 浅色宣纸感 */
            border: 2px solid #5c4433;
            padding: 35px 25px;
            font-size: 18px;
            letter-spacing: 4px;
            writing-mode: vertical-rl;
            text-align: start;
            line-height: 1.8;
            transition: all 0.3s ease-out;
        }

        @keyframes popUp {
            from { transform: translate(-50%, -20%) scale(0.6); opacity: 0; }
            to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        /* 签内文字排版 */
        .card-title {
            font-size: 24px;
            font-weight: bold;
            color: #1a1a1a;
            margin-left: 15px; /* 竖排时为左侧间距 */
            border-left: 1px dotted #ccc;
            padding-left: 10px;
        }
        .card-content {
            color: #4a443c;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <!-- 顶栏文字已修改为 药方抽签 -->
    <div class="title">三十七道品 · 药方抽签</div>

    <!-- 签筒 -->
    <div class="container" id="holderContainer" onclick="drawStick()">
        <div class="stick-holder" id="stickHolder">三十七道品</div>
    </div>

    <!-- 遮罩与签面 -->
    <div class="mask" id="mask" onclick="closeCard()"></div>
    <div id="resultCard" class="result-card" onclick="handleCardClick()"></div>

    <script>
        // 7个签及其对应的解签内容
        const data = {
            "四念处": "身念住、受念住、心念住、法念住\n观身不净、观受是苦、观心无常、观法无我",
            "四正勤": "已生恶令断灭、未生恶令不生\n未生善令生起、已生善令增长",
            "四神足": "欲神足、勤神足、心神足、观神足",
            "五根": "信、精进、念、定、慧",
            "五力": "信、精进、念、定、慧",
            "七觉支": "念、择法、精进、喜\n轻安、定、舍",
            "八正道": "正见、正思维、正语、正业\n正命、正精进、正念、正定"
        };

        const keys = Object.keys(data);
        let isShaking = false;
        let currentStatus = "closed"; // closed, drawn, expanded
        let selectedSign = "";

        function drawStick() {
            if (isShaking || currentStatus !== "closed") return;
            isShaking = true;

            const holder = document.getElementById('stickHolder');
            holder.classList.add('shaking');

            // 摇签过程
            setTimeout(() => {
                holder.classList.remove('shaking');
                
                // 随机抽取
                selectedSign = keys[Math.floor(Math.random() * keys.length)];

                // 显示初签（仅显示总名）
                const card = document.getElementById('resultCard');
                card.innerText = selectedSign;
                card.className = "result-card"; // 恢复初始样式
                
                document.getElementById('mask').style.display = 'block';
                card.style.display = 'block';
                
                currentStatus = "drawn";
                isShaking = false;
            }, 800);
        }

        function handleCardClick() {
            const card = document.getElementById('resultCard');
            
            if (currentStatus === "drawn") {
                // 点击初签，展现细目答案
                const answer = data[selectedSign].replace(/\n/g, '<br> '); // 换行对齐
                card.innerHTML = `<span class="card-title">${selectedSign}</span><span class="card-content">${answer}</span>`;
                card.classList.add('expanded');
                currentStatus = "expanded";
            } else if (currentStatus === "expanded") {
                // 再次点击，收回
                closeCard();
            }
        }

        function closeCard() {
            document.getElementById('mask').style.display = 'none';
            document.getElementById('resultCard').style.display = 'none';
            currentStatus = "closed";
        }
    </script>
</body>
</html>
