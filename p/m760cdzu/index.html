<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>觉性十三禅</title>
    <style>
        /* 基础样式与宣纸底色 */
        body {
            margin: 0;
            padding: 0;
            background-color: #FDFCF0; /* 柔和的宣纸微黄底色 */
            font-family: "PingFang SC", "Lantinghei SC", "Microsoft YaHei", sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 禅意水墨背景暗纹（写意禅圈） */
        .zen-bg {
            position: absolute;
            width: 320px;
            height: 320px;
            border: 6px solid rgba(90, 80, 70, 0.04);
            border-radius: 50%;
            border-left-color: rgba(90, 80, 70, 0.08);
            border-bottom-color: rgba(90, 80, 70, 0.06);
            transform: rotate(-45deg);
            pointer-events: none;
            z-index: 1;
        }

        /* 场景容器 */
        .container {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2;
        }

        /* 签筒区域与悬浮呼吸动效 */
        .container-inner {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: float 4s ease-in-out infinite;
            cursor: pointer;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        /* 阴影随呼吸缩放 */
        .shadow {
            width: 120px;
            height: 12px;
            background: rgba(40, 30, 20, 0.06);
            border-radius: 50%;
            filter: blur(4px);
            margin-top: 15px;
            transition: all 0.3s ease;
        }

        /* 古朴签筒样式 */
        .cylinder {
            width: 130px;
            height: 220px;
            background: linear-gradient(135deg, #4A3B32 0%, #2F231B 100%);
            border-radius: 12px 12px 6px 6px;
            border: 2px solid #201610;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6), 5px 10px 20px rgba(0,0,0,0.15);
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 签筒口微内凹视觉 */
        .cylinder::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 14px;
            background: #1C130E;
            border-radius: 10px 10px 0 0;
            box-shadow: inset 0 -3px 5px rgba(0,0,0,0.5);
        }

        /* 签筒文字标签 */
        .label {
            background-color: #E8E2D5;
            padding: 15px 8px;
            color: #2F231B;
            font-weight: bold;
            font-size: 16px;
            letter-spacing: 4px;
            writing-mode: vertical-rl; /* 传统竖排 */
            border: 1px solid #C8BFA9;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
            border-radius: 2px;
            margin-top: 10px;
        }

        /* 摇晃动效样式 */
        .shake-animation {
            animation: shake 0.8s ease-in-out !important;
        }

        @keyframes shake {
            0%, 100% { transform: rotate(0deg); }
            15% { transform: rotate(-8deg) translateX(-4px); }
            30% { transform: rotate(7deg) translateX(4px); }
            45% { transform: rotate(-5deg) translateX(-3px); }
            60% { transform: rotate(4deg) translateX(3px); }
            75% { transform: rotate(-2deg) translateX(-1px); }
            90% { transform: rotate(1deg) translateX(1px); }
        }

        /* 遮罩层 */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(253, 252, 240, 0.85); /* 宣纸半透明遮罩 */
            backdrop-filter: blur(2px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
            z-index: 10;
        }

        .overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        /* 弹出的竹签样式 */
        .fortune-stick {
            background: linear-gradient(to bottom, #F4ECD8 0%, #E6D5B8 100%);
            width: 75px;
            height: 400px;
            border-radius: 30px;
            border: 2px solid #C5B293;
            box-shadow: 3px 5px 20px rgba(40, 30, 20, 0.15), inset 0 0 10px rgba(255,255,255,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 30px 0;
            box-sizing: border-box;
            transform: translateY(50px) scale(0.9);
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .overlay.show .fortune-stick {
            transform: translateY(0) scale(1);
        }

        /* 竹签顶部装饰圆孔 */
        .stick-top {
            width: 8px;
            height: 8px;
            background: #BAA685;
            border-radius: 50%;
        }

        /* 竹签核心文字：竖排书写 */
        .stick-content {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-size: 24px;
            color: #2F231B;
            letter-spacing: 6px;
            font-weight: 500;
            text-align: center;
            line-height: 1.5;
            opacity: 0;
            transition: opacity 0.4s ease 0.3s;
            margin-top: 10px;
        }

        .overlay.show .stick-content {
            opacity: 1;
        }

        /* 签底文字：两排横排 */
        .stick-bottom {
            font-size: 11px;
            color: #8A785F;
            letter-spacing: 2px;
            line-height: 1.8;
            border-top: 1px dashed #C5B293;
            padding-top: 12px;
            width: 70%;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* 引导语提示 */
        .hint-text {
            position: absolute;
            bottom: 12%;
            color: #8A785F;
            font-size: 14px;
            letter-spacing: 2px;
            text-align: center;
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- 水墨暗纹背景 -->
    <div class="zen-bg"></div>

    <div class="container">
        <!-- 可点击的签筒主体 -->
        <div class="container-inner" id="drawButton" onclick="drawZenStick()">
            <div class="cylinder">
                <div class="label">觉性十三禅</div>
            </div>
            <div class="shadow" id="cylinderShadow"></div>
        </div>
        
        <!-- 引导语 -->
        <div class="hint-text">清修片刻 · 领受觉法</div>
    </div>

    <!-- 领法弹窗遮罩 -->
    <div class="overlay" id="resultOverlay" onclick="closeOverlay()">
        <div class="fortune-stick">
            <div class="stick-top"></div>
            <!-- 展现的具体法门 -->
            <div class="stick-content" id="stickText">放松禅</div>
            <!-- 横排两行文字 -->
            <div class="stick-bottom">
                <div>慢慢走</div>
                <div>快快到</div>
            </div>
        </div>
    </div>

    <script {rule_1_strict_completion}>
        // 十三禅内容
        const zenMethods = [
            "放松禅", "禅睡", "觉之诵", "觉之舞", "觉知音", 
            "呼吸禅", "视觉禅", "听觉禅", "触觉禅", "行禅", 
            "意识禅", "慈心禅", "觉察"
        ];

        let isShaking = false;

        function drawZenStick() {
            if (isShaking) return;
            isShaking = true;

            const containerInner = document.getElementById('drawButton');
            const shadow = document.getElementById('cylinderShadow');
            
            containerInner.classList.add('shake-animation');
            shadow.style.transform = "scale(0.8)";
            shadow.style.opacity = "0.3";

            setTimeout(() => {
                const randomIndex = Math.floor(Math.random() * zenMethods.length);
                const selectedZen = zenMethods[randomIndex];

                document.getElementById('stickText').innerText = selectedZen;
                document.getElementById('resultOverlay').classList.add('show');

                containerInner.classList.remove('shake-animation');
                shadow.style.transform = "scale(1)";
                shadow.style.opacity = "1";
                isShaking = false;
            }, 800);
        }

        function closeOverlay() {
            document.getElementById('resultOverlay').classList.remove('show');
        }
    </script>
</body>
</html>
