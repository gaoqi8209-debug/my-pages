<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>觉性十三禅</title>
    <style>
        /* 基础样式与宣纸底色 */
        body {
            margin: 0;
            padding: 0;
            background-color: #FDFCF0; /* 柔和的宣纸微黄底色 */
            font-family: "PingFang SC", "Lantinghei SC", "Microsoft YaHei", sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 禅意水墨背景暗纹（写意禅圈） */
        .zen-bg {
            position: absolute;
            width: 320px;
            height: 320px;
            border: 6px solid rgba(90, 80, 70, 0.04);
            border-radius: 50%;
            border-left-color: rgba(90, 80, 70, 0.08);
            border-bottom-color: rgba(90, 80, 70, 0.06);
            transform: rotate(-45deg);
            pointer-events: none;
            z-index: 1;
        }

        /* 场景容器 */
        .container {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2;
        }

        /* 签筒区域与悬浮呼吸动效 */
        .container-inner {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: float 4s ease-in-out infinite;
            cursor: pointer;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        /* 阴影随呼吸缩放 */
        .shadow {
            width: 120px;
            height: 12px;
            background: rgba(40, 30, 20, 0.06);
            border-radius: 50%;
            filter: blur(4px);
            margin-top: 15px;
            transition: all 0.3s ease;
        }

        /* 古朴签筒样式 */
        .cylinder {
            width: 130px;
            height: 220px;
            background: linear-gradient(135deg, #4A3B32 0%, #2F231B 100%);
            border-radius: 12px 12px 6px 6px;
            border: 2px solid #201610;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6), 5px 10px 20px rgba(0,0,0,0.15);
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 签筒口微内凹视觉 */
        .cylinder::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 14px;
            background: #1C130E;
            border-radius: 10px 10px 0 0;
            box-shadow: inset 0 -3px 5px rgba(0,0,0,0.5);
        }

        /* 签筒文字标签 */
        .label {
            background-color: #E8E2D5;
            padding: 15px 8px;
            color: #2F231B;
            font-weight: bold;
            font-size: 16px;
            letter-spacing: 4px;
            writing-mode: vertical-rl; /* 传统竖排 */
            border: 1px solid #C8BFA9;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
            border-radius: 2px;
            margin-top: 10px;
        }

        /* 摇晃动效样式 */
        .shake-animation {
            animation: shake 0.8s ease-in-out !important;
        }

        @keyframes shake {
            0%, 100% { transform: rotate(0deg); }
            15% { transform: rotate(-8deg) translateX(-4px); }
            30% { transform: rotate(7deg) translateX(4px); }
            45% { transform: rotate(-5deg) translateX(-3px); }
            60% { transform: rotate(4deg) translateX(3px); }
            75% { transform: rotate(-2deg) translateX(-1px); }
            90% { transform: rotate(1deg) translateX(1px); }
        }

        /* 遮罩层 */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(253, 252, 240, 0.92); /* 宣纸半透明遮罩 */
            backdrop-filter: blur(2px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
            z-index: 10;
        }

        .overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        /* 弹出互动的签体容器 */
        .stick-container {
            width: 85%;
            max-width: 320px;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        /* 竹签样式 */
        .fortune-stick {
            background: linear-gradient(to bottom, #F4ECD8 0%, #E6D5B8 100%);
            width: 85px;
            height: 440px;
            border-radius: 30px;
            border: 2px solid #C5B293;
            box-shadow: 3px 5px 20px rgba(40, 30, 20, 0.15), inset 0 0 10px rgba(255,255,255,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 25px 0;
            box-sizing: border-box;
            transform: translateY(50px) scale(0.9);
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.1);
            cursor: pointer;
        }

        .overlay.show .fortune-stick {
            transform: translateY(0) scale(1);
        }

        /* 点击展示解释时，竹签展宽变换样式 */
        .fortune-stick.show-detail {
            width: 280px;
            height: auto;
            min-height: 400px;
            border-radius: 16px;
            padding: 30px 24px;
            justify-content: flex-start;
        }

        /* 竹签顶部装饰圆孔 */
        .stick-top {
            width: 8px;
            height: 8px;
            background: #BAA685;
            border-radius: 50%;
        }
        .fortune-stick.show-detail .stick-top {
            display: none;
        }

        /* 签文主体外层 */
        .stick-body {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
            justify-content: center;
            transition: opacity 0.3s ease;
        }

        /* 竹签核心文字：默认竖排书写 */
        .stick-content {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-size: 24px;
            color: #2F231B;
            letter-spacing: 6px;
            font-weight: 500;
            text-align: center;
            line-height: 1.5;
            opacity: 0;
            transition: opacity 0.4s ease 0.3s;
        }

        .overlay.show .stick-content {
            opacity: 1;
        }

        /* 解释文本样式：横排展现 */
        .stick-detail {
            display: none;
            text-align: left;
            color: #4A3B32;
            font-size: 15px;
            line-height: 1.8;
            letter-spacing: 1px;
            width: 100%;
            animation: fadeIn 0.4s ease forwards;
        }

        .stick-detail h3 {
            margin: 0 0 16px 0;
            text-align: center;
            font-size: 20px;
            color: #2F231B;
            border-bottom: 1px dashed #C5B293;
            padding-bottom: 10px;
            font-weight: 500;
        }

        .stick-detail p {
            margin: 0 0 15px 0;
            white-space: pre-wrap; /* 保持换行格式 */
        }

        /* 融入宣纸样式的图片呈现 */
        .stick-img {
            display: block;
            width: 100%;
            max-height: 240px;
            object-fit: contain;
            border-radius: 6px;
            margin: 10px auto 15px auto;
            box-shadow: 0 2px 8px rgba(40, 30, 20, 0.08);
            border: 1px solid rgba(197, 178, 147, 0.3);
        }

        .stick-detail .zen-footer {
            text-align: center;
            font-weight: bold;
            color: #8A785F;
            margin-top: 25px;
            letter-spacing: 3px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 签底文字 */
        .stick-bottom {
            font-size: 11px;
            color: #8A785F;
            letter-spacing: 2px;
            line-height: 1.8;
            border-top: 1px dashed #C5B293;
            padding-top: 12px;
            width: 70%;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .fortune-stick.show-detail .stick-bottom {
            display: none;
        }

        /* 引导语提示 */
        .hint-text {
            position: absolute;
            bottom: 12%;
            color: #8A785F;
            font-size: 14px;
            letter-spacing: 2px;
            text-align: center;
            width: 100%;
        }

        /* 签面提示语 */
        .click-hint {
            font-size: 11px;
            color: #BAA685;
            margin-top: 10px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="zen-bg"></div>

    <div class="container">
        <div class="container-inner" id="drawButton" onclick="drawZenStick()">
            <div class="cylinder">
                <div class="label">觉性十三禅</div>
            </div>
            <div class="shadow" id="cylinderShadow"></div>
        </div>
        
        <div class="hint-text">清修片刻 · 领受觉法</div>
    </div>

    <div class="overlay" id="resultOverlay" onclick="handleOverlayClick(event)">
        <div class="stick-container">
            <div class="fortune-stick" id="fortuneStick" onclick="revealDetail(event)">
                <div class="stick-top"></div>
                
                <div class="stick-body" id="stickBody">
                    <div class="stick-content" id="stickText">放松禅</div>
                    <div class="click-hint" id="clickHint">轻触开解</div>
                </div>

                <div class="stick-detail" id="stickDetail">
                    <!-- 动态渲染解释内容 -->
                </div>
                
                <div class="stick-bottom">
                    <div>慢慢走</div>
                    <div>快快到</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 十三禅完整清单 - 内容全部圆满配置完毕
        const zenMethods = [
            {
                name: "呼吸禅",
                hasDetail: true,
                details: [
                    {
                        title: "呼吸禅：观呼吸",
                        content: "早上醒来或其他空闲时段，找一个舒服的地方静静地坐一会，不看手机，只是静静地观察自己的呼吸，呼吸的频率，呼吸的深度等等。",
                        imgUrl: "",
                        footer: "觉知当下"
                    }
                ]
            },
            {
                name: "触觉禅",
                hasDetail: true,
                details: [
                    {
                        title: "触觉禅：感知",
                        content: "选择手边或公园里五种材质不同的物品，进行触觉禅，摸一摸这个物品的质地，感受不同的质地给我们的心理带来的不同感觉。",
                        imgUrl: "",
                        footer: "觉知当下"
                    }
                ]
            },
            {
                name: "意识禅",
                hasDetail: true,
                details: [
                    {
                        title: "意识禅：观念头",
                        content: "今天，有意识地在不同时刻觉知自己的念头，可以感受一下这个念头给您带来的感受，这个念头来自哪里。只是觉知，不带评判。",
                        imgUrl: "",
                        footer: "觉知当下"
                    }
                ]
            },
            {
                name: "慈心禅",
                hasDetail: true,
                details: [
                    {
                        title: "慈心禅：送祝福",
                        content: "今天，在早上出门前或任何您有空的时候，用心为家人、邻居、朋友送上真诚的祝福，希望您开心，希望您快乐，希望您欢喜自在、早日离苦得乐、究竟圆满。",
                        imgUrl: "",
                        footer: "觉知当下"
                    }
                ]
            },
            {
                name: "放松禅",
                hasDetail: true,
                details: [
                    {
                        title: "放松禅：休息",
                        content: "今天，在身体疲倦的时候拿出宇廷老师的引导音频，好好地给自己的身心来一个 spa，自上而下放松我们的头部、颈部、肩部、背部，一直到脚趾头，让我们的身体和心都变得松松的，像云朵一样，像棉花糖一样。",
                        imgUrl: "",
                        footer: "觉知当下"
                    }
                ]
            },
            {
                name: "视觉禅",
                hasDetail: true,
                details: [
                    {
                        title: "视觉禅：观云",
                        content: "今天，腾出一点时间，抬头看一看天上的云朵，带着觉，看一看它们的形状，看着它们不断地来来去去，聚散变化着，带着放松的心情，觉知它们的变化。也可以感受一下它们变化时我们念头的变化。",
                        imgUrl: "",
                        footer: "觉知当下"
                    },
                    {
                        title: "视觉禅",
                        content: "",
                        imgUrl: "https://pic1.imgdb.cn/item/6a40c3b333bc7bc02d77f517.jpg",
                        footer: "觉知当下"
                    }
                ]
            },
            {
                name: "禅睡",
                hasDetail: true,
                details: [
                    {
                        title: "禅睡",
                        content: "",
                        imgUrl: "https://pic1.imgdb.cn/item/6a40c3b333bc7bc02d77f516.jpg",
                        footer: "觉知当下"
                    }
                ]
            },
            {
                name: "听觉禅",
                hasDetail: true,
                details: [
                    {
                        title: "听觉禅",
                        content: "",
                        imgUrl: "https://pic1.imgdb.cn/item/6a40c3b333bc7bc02d77f518.png",
                        footer: "觉知当下"
                    }
                ]
            },
            {
                name: "行禅",
                hasDetail: true,
                details: [
                    {
                        title: "行禅：缓慢行走，极度专注脚底",
                        content: "今天，当你需要从静止状态（如久坐）切换到活动状态时，先有意识地做三个深呼吸，感受身体，然后再行动。这就是一个微型的\"动静转换禅\"。",
                        imgUrl: "",
                        footer: "觉知当下"
                    }
                ]
            },
            {
                name: "觉之舞",
                hasDetail: true,
                details: [
                    {
                        title: "觉之舞：觉察放松和呼吸",
                        content: "跟随音频自由舞动，不追求动作，只感受身体想如何表达，保持对动作和呼吸的觉察",
                        imgUrl: "",
                        footer: "觉知当下"
                    }
                ]
            },
            {
                name: "觉之诵",
                hasDetail: true,
                details: [
                    {
                        title: "觉之诵：放低专注点",
                        content: "如果你觉得气还是下不去，可以花个3分钟、5分钟，把专注点放在脚板心跟地接触的那个地方，不需要很用力，就是很放松地，让你的专注力放在很低的位置，丹田或者脚板心都可以，这时候有时候会让你的气息更放松下去。",
                        imgUrl: "",
                        footer: "觉知当下"
                    }
                ]
            },
            {
                name: "觉之音",
                hasDetail: true,
                details: [
                    {
                        title: "觉之音：把心靠在音乐上",
                        content: "请打开一首央金老师的音乐，找一个放松的角落，闭上眼睛把心靠在音乐上。",
                        imgUrl: "",
                        footer: "觉知当下"
                    }
                ]
            },
            {
                name: "觉察",
                hasDetail: true,
                details: [
                    {
                        title: "觉与觉察：少量多次",
                        content: "保持放松，觉与觉察的转换，少量多次练习，念头跑了温肉的拉回来。",
                        imgUrl: "",
                        footer: "觉知当下"
                    }
                ]
            }
        ];

        let isShaking = false;
        let currentZen = null;
        let isRevealed = false;

        function drawZenStick() {
            if (isShaking) return;
            isShaking = true;

            const containerInner = document.getElementById('drawButton');
            const shadow = document.getElementById('cylinderShadow');
            
            containerInner.classList.add('shake-animation');
            shadow.style.transform = "scale(0.8)";
            shadow.style.opacity = "0.3";

            setTimeout(() => {
                const randomIndex = Math.floor(Math.random() * zenMethods.length);
                currentZen = zenMethods[randomIndex];

                document.getElementById('stickText').innerText = currentZen.name;
                resetStick();

                document.getElementById('resultOverlay').classList.add('show');

                containerInner.classList.remove('shake-animation');
                shadow.style.transform = "scale(1)";
                shadow.style.opacity = "1";
                isShaking = false;
            }, 800);
        }

        function revealDetail(event) {
            event.stopPropagation();
            
            if (isRevealed) {
                closeOverlay();
                return;
            }

            if (!currentZen.hasDetail || !currentZen.details || currentZen.details.length === 0) {
                closeOverlay();
                return;
            }

            const stick = document.getElementById('fortuneStick');
            const stickBody = document.getElementById('stickBody');
            const stickDetail = document.getElementById('stickDetail');

            stickBody.style.opacity = "0";
            
            setTimeout(() => {
                stickBody.style.display = "none";
                
                const randomVersionIndex = Math.floor(Math.random() * currentZen.details.length);
                const selectedVersion = currentZen.details[randomVersionIndex];
                
                let imageHtml = selectedVersion.imgUrl ? `<img class="stick-img" src="${selectedVersion.imgUrl}" alt="zen-image">` : '';
                let textHtml = selectedVersion.content ? `<p>${selectedVersion.content}</p>` : '';

                stickDetail.innerHTML = `
                    <h3>${selectedVersion.title}</h3>
                    ${imageHtml}
                    ${textHtml}
                    <div class="zen-footer">${selectedVersion.footer}</div>
                `;
                
                stick.classList.add('show-detail');
                stickDetail.style.display = "block";
                isRevealed = true;
            }, 300);
        }

        function handleOverlayClick(event) {
            closeOverlay();
        }

        function closeOverlay() {
            document.getElementById('resultOverlay').classList.remove('show');
            setTimeout(resetStick, 500);
        }

        function resetStick() {
            const stick = document.getElementById('fortuneStick');
            const stickBody = document.getElementById('stickBody');
            const stickDetail = document.getElementById('stickDetail');
            const clickHint = document.getElementById('clickHint');

            if (currentZen && !currentZen.hasDetail) {
                clickHint.style.visibility = "hidden";
            } else {
                clickHint.style.visibility = "visible";
            }

            stick.classList.remove('show-detail');
            stickDetail.style.display = "none";
            stickDetail.innerHTML = "";
            stickBody.style.display = "flex";
            stickBody.style.opacity = "1";
            isRevealed = false;
        }
    </script>
</body>
</html>
