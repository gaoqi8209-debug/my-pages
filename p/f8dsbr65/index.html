<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>觉性十三禅</title>
    <style>
        /* 基础样式与宣纸底色 */
        body {
            margin: 0;
            padding: 0;
            background-color: #FDFCF0; /* 柔和的宣纸微黄底色 */
            font-family: "PingFang SC", "Lantinghei SC", "Microsoft YaHei", sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 禅意水墨背景暗纹（写意禅圈） */
        .zen-bg {
            position: absolute;
            width: 320px;
            height: 320px;
            border: 6px solid rgba(90, 80, 70, 0.04);
            border-radius: 50%;
            border-left-color: rgba(90, 80, 70, 0.08);
            border-bottom-color: rgba(90, 80, 70, 0.06);
            transform: rotate(-45deg);
            pointer-events: none;
            z-index: 1;
        }

        /* 场景容器 */
        .container {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2;
        }

        /* 签筒区域与悬浮呼吸动效 */
        .container-inner {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: float 4s ease-in-out infinite;
            cursor: pointer;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        /* 阴影随呼吸缩放 */
        .shadow {
            width: 120px;
            height: 12px;
            background: rgba(40, 30, 20, 0.06);
            border-radius: 50%;
            filter: blur(4px);
            margin-top: 15px;
            transition: all 0.3s ease;
        }

        /* 古朴签筒样式 */
        .cylinder {
            width: 130px;
            height: 220px;
            background: linear-gradient(135deg, #4A3B32 0%, #2F231B 100%);
            border-radius: 12px 12px 6px 6px;
            border: 2px solid #201610;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6), 5px 10px 20px rgba(0,0,0,0.15);
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 签筒口微内凹视觉 */
        .cylinder::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 14px;
            background: #1C130E;
            border-radius: 10px 10px 0 0;
            box-shadow: inset 0 -3px 5px rgba(0,0,0,0.5);
        }

        /* 签筒文字标签 */
        .label {
            background-color: #E8E2D5;
            padding: 15px 8px;
            color: #2F231B;
            font-weight: bold;
            font-size: 16px;
            letter-spacing: 4px;
            writing-mode: vertical-rl; /* 传统竖排 */
            border: 1px solid #C8BFA9;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
            border-radius: 2px;
            margin-top: 10px;
        }

        /* 摇晃动效样式 */
        .shake-animation {
            animation: shake 0.8s ease-in-out !important;
        }

        @keyframes shake {
            0%, 100% { transform: rotate(0deg); }
            15% { transform: rotate(-8deg) translateX(-4px); }
            30% { transform: rotate(7deg) translateX(4px); }
            45% { transform: rotate(-5deg) translateX(-3px); }
            60% { transform: rotate(4deg) translateX(3px); }
            75% { transform: rotate(-2deg) translateX(-1px); }
            90% { transform: rotate(1deg) translateX(1px); }
        }

        /* 遮罩层 */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(253, 252, 240, 0.94); /* 微调半透明宣纸遮罩，利于赏图 */
            backdrop-filter: blur(3px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
            z-index: 10;
        }

        .overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        /* 弹出互动的签体容器 */
        .stick-container {
            width: 90%;
            max-width: 340px;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        /* 竹签样式 */
        .fortune-stick {
            background: linear-gradient(to bottom, #F4ECD8 0%, #E6D5B8 100%);
            width: 85px;
            height: 440px;
            border-radius: 30px;
            border: 2px solid #C5B293;
            box-shadow: 3px 5px 20px rgba(40, 30, 20, 0.15), inset 0 0 10px rgba(255,255,255,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 25px 0;
            box-sizing: border-box;
            transform: translateY(50px) scale(0.9);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.1);
            cursor: pointer;
        }

        .overlay.show .fortune-stick {
            transform: translateY(0) scale(1);
        }

        /* 当有文字说明时，常规展宽形态 */
        .fortune-stick.show-detail {
            width: 290px;
            height: auto;
            min-height: 400px;
            border-radius: 16px;
            padding: 30px 24px;
            justify-content: flex-start;
        }

        /* 【核心重构】当属于“纯图片”开解时，让竹签材质完全隐形，图片放到最大 */
        .fortune-stick.show-pure-image {
            width: 100vw;
            height: 90vh;
            max-width: 360px;
            background: transparent;
            border: none;
            box-shadow: none;
            padding: 0;
            justify-content: center;
        }

        /* 竹签顶部装饰圆孔 */
        .stick-top {
            width: 8px;
            height: 8px;
            background: #BAA685;
            border-radius: 50%;
        }
        .fortune-stick.show-detail .stick-top,
        .fortune-stick.show-pure-image .stick-top {
            display: none;
        }

        /* 签文主体外层 */
        .stick-body {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
            justify-content: center;
            transition: opacity 0.3s ease;
        }

        /* 竹签核心文字：默认竖排书写 */
        .stick-content {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-size: 24px;
            color: #2F231B;
            letter-spacing: 6px;
            font-weight: 500;
            text-align: center;
            line-height: 1.5;
            opacity: 0;
            transition: opacity 0.4s ease 0.3s;
        }

        .overlay.show .stick-content {
            opacity: 1;
        }

        /* 解释文本样式：横排展现 */
        .stick-detail {
            display: none;
            text-align: left;
            color: #4A3B32;
            font-size: 15px;
            line-height: 1.8;
            letter-spacing: 1px;
            width: 100%;
            animation: fadeIn 0.4s ease forwards;
        }

        .stick-detail h3 {
            margin: 0 0 16px 0;
            text-align: center;
            font-size: 20px;
            color: #2F231B;
            border-bottom: 1px dashed #C5B293;
            padding-bottom: 10px;
            font-weight: 500;
        }

        .stick-detail p {
            margin: 0 0 15px 0;
            white-space: pre-wrap; /* 保持换行格式 */
        }

        /* 融入宣纸样式的图片呈现：自适应最大化宽度 */
        .stick-img {
            display: block;
            width: 100%;
            height: auto;
            max-height: 72vh; /* 避免手机屏幕高度溢出 */
            object-fit: contain;
            border-radius: 8px;
            margin: 5px auto;
            animation: fadeIn 0.4s ease forwards;
        }

        /* 纯图模式下的视觉阴影和边框，突出大图质感 */
        .fortune-stick.show-pure-image .stick-img {
            box-shadow: 0 4px 25px rgba(40, 30, 20, 0.15);
            border: 1px solid rgba(197, 178, 147, 0.2);
            background-color: #FDFCF0;
        }

        .stick-detail .zen-footer {
            text-align: center;
            font-weight: bold;
            color: #8A785F;
            margin-top: 25px;
            letter-spacing: 3px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 签底文字 */
        .stick-bottom {
            font-size: 11px;
            color: #8A785F;
            letter-spacing: 2px;
            line-height: 1.8;
            border-top: 1px dashed #C5B293;
            padding-top: 12px;
            width: 70%;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .fortune-stick.show-detail .stick-bottom,
        .fortune-stick.show-pure-image .stick-bottom {
            display: none;
        }

        /* 引导语提示 */
        .hint-text {
            position: absolute;
            bottom: 12%;
            color: #8A785F;
            font-size: 14px;
            letter-spacing: 2px;
            text-align: center;
            width: 100%;
        }

        /* 签面提示语 */
        .click-hint {
            font-size: 11px;
            color: #BAA685;
            margin-top: 10px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

                <div class="stick-bottom">
                    <div>慢慢走</div>
                    <div>快快到</div>
                </div>
            </div>
        </div>
    </div>
