                        goldMain: '#C59B27',      // 经典法器金

            font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* 曼陀罗图腾金光呼吸效 */
        @keyframes mandalaGlow {

                filter: drop-shadow(0 0 10px rgba(197, 155, 39, 0.4)) drop-shadow(0 0 20px rgba(197, 155, 39, 0.2));

                transform: scale(1.02);
            }
        }

        .mandala-glow {
            animation: mandalaGlow 4s infinite ease-in-out;
        }

        /* 3D 卡片翻转效果 */
        .perspective-1000 {
            perspective: 1000px;
        }
        .transform-style-3d {
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.34, 1.4, 0.64, 1);
        }
        .backface-hidden {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }

        .corner-decoration {
            position: absolute;
            width: 14px;
            height: 14px;
            border-color: #C59B27;
            border-style: solid;
            pointer-events: none;

        .corner-tl { top: 8px; left: 8px; border-width: 2px 0 0 2px; }
        .corner-tr { top: 8px; right: 8px; border-width: 2px 2px 0 0; }
        .corner-bl { bottom: 8px; left: 8px; border-width: 0 0 2px 2px; }
        .corner-br { bottom: 8px; right: 8px; border-width: 0 2px 2px 0; }

        /* Toast 弹窗动画 */
        #toast {
            transition: opacity 0.3s ease, transform 0.3s ease;

            { 
                category: "🌿 天地和合境", 
                title: "【高处远眺卡】", 
                tool: "欲解脱智",
                guide: "在楼顶露台、山顶或高层窗前，面向远方开阔处，舒展肢体起舞或发声唱诵 5 分钟。", 
                hook: "往最远的地方看，伸个大大的懒腰，把胸怀彻底张开，红尘里的小琐事全都烟消云散啦！" 
            },
            { 
                category: "🌿 天地和合境", 
                title: "【沐风听雨卡】", 
                tool: "舍觉支",
                guide: "在风吹过或下雨时，站在窗前或伞下，全身心感受风雨之势起舞或唱诵 5 分钟。", 
                hook: "感受风吹在脸上的凉爽，让雨声帮你清空脑子里的杂念，顺应自然多舒服呀！" 
            },

            // 5. 🎁 欢喜利他境
            { 
                category: "🎁 欢喜利他境", 
                title: "【喜悦祝福卡】", 
                tool: "喜觉支",
                guide: "在广场、医院附近或十字路口角落，带着无私的祝福心，默诵或轻柔舞蹈 5 分钟。", 
                hook: "带着微笑唱诵，把这份轻松愉快的好磁场悄悄送给路过的人，心里也会暖洋洋的！" 
            },
            { 
                category: "🎁 欢喜利他境", 
                title: "【默默赞叹卡】", 
                tool: "缘摄受智",
                guide: "观察一位正在辛勤工作的人（如清洁工、外卖员），配合他的劳动节奏，默诵或微舞 5 分钟。", 
                hook: "心里默默为辛劳的他们道一声辛苦，体谅每一个努力生活的人，心情也会跟着变得软软的。" 
            },
            { 
                category: "🎁 欢喜利他境", 
                title: "【回向大千卡】", 
                tool: "过患智",
                guide: "完成一段觉之舞或唱诵后，双手合十或静立，将身心放松的能量默默回向给所有人。", 
                hook: "跳完唱完，不执着于好坏，把这份全身松快的好情绪，大方地分享给全世界吧～" 
            }
        ];

        let currentCard = null;
        let isFlipped = false;

        function handleCardClick() {
            if (!isFlipped) {
                drawRandomCard();
            }
        }

        function updateCardDOM(card, index) {
            currentCard = card;
            document.getElementById('cardCategory').innerText = card.category;
            document.getElementById('cardNo').innerText = `NO.${(index + 1).toString().padStart(2, '0')} / 15`;
            document.getElementById('cardTitle').innerText = card.title;
            document.getElementById('toolBtnText').innerText = card.tool;
            document.getElementById('cardGuide').innerText = card.guide;
            document.getElementById('cardHook').innerText = card.hook;
        }

        function showCard() {
            const container = document.getElementById('cardContainer');
            const copyBtn = document.getElementById('copyBtn');

            if (!isFlipped) {
                container.classList.add('rotate-y-180');
                isFlipped = true;
            }
            copyBtn.classList.remove('hidden');
        }

        function drawRandomCard() {
            const randomIndex = Math.floor(Math.random() * cardsData.length);
            const selectedCard = cardsData[randomIndex];

            if (isFlipped) {
                const container = document.getElementById('cardContainer');
                container.classList.remove('rotate-y-180');
                isFlipped = false;
                setTimeout(() => {
                    updateCardDOM(selectedCard, randomIndex);
                    showCard();
                }, 400);
            } else {
                updateCardDOM(selectedCard, randomIndex);
                showCard();
            }
        }

        function drawDailyCard() {
            const today = new Date();
            const dayOfMonth = today.getDate();
            const dailyIndex = (dayOfMonth - 1) % cardsData.length;
            const selectedCard = cardsData[dailyIndex];

            if (isFlipped) {
                const container = document.getElementById('cardContainer');
                container.classList.remove('rotate-y-180');
                isFlipped = false;
                setTimeout(() => {
                    updateCardDOM(selectedCard, dailyIndex);
                    showCard();
                }, 400);
            } else {
                updateCardDOM(selectedCard, dailyIndex);
                showCard();
            }
        }

        function openToolModal(event) {
            event.stopPropagation();
            if (!currentCard) return;

            const toolName = currentCard.tool;
            const desc = toolDefinitions[toolName] || `【${toolName}】在对境练习中保持觉知与松爽的实修工具。`;

            document.getElementById('modalToolTitle').innerText = `✦ 修持工具：${toolName} ✦`;
            document.getElementById('modalToolDesc').innerText = desc;

            const modal = document.getElementById('toolModal');
            modal.classList.remove('opacity-0', 'pointer-events-none');
        }

        function closeToolModal() {
            const modal = document.getElementById('toolModal');
            modal.classList.add('opacity-0', 'pointer-events-none');
        }

        function copyTemplate() {
            if (!currentCard) return;

            const categoryEmoji = currentCard.category.split(' ')[0] || '';
            
            const copyText = `🪞${currentCard.title}${categoryEmoji}
✦ 修持工具：${currentCard.tool} ✦

--- ✍️ 我的觉察 ---`;

            navigator.clipboard.writeText(copyText).then(() => {
                showToast("已复制打卡模板，快去微信群发文字与照片/视频吧！");
            }).catch(() => {
                const textarea = document.createElement('textarea');
                textarea.value = copyText;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast("已复制打卡模板，快去微信群发文字与照片/视频吧！");
            });
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 3000);
        }
    </script>
</body>
</html>
